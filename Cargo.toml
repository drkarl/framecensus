[package]
name = "framecensus"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Planned library and command-line tool for structural completeness checks on rendered image sequences; no checks implemented yet."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"], optional = true }

[dev-dependencies]
assert_cmd = "2.2"

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "framecensus"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
